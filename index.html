<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0720">
<title>Trivia Blitz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0a0720;--ink:#f5f2ff;--muted:#a49cd6;--card:rgba(255,255,255,.065);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.13);
  --pink:#ff3d9a;--violet:#8a3dff;--cyan:#22e4ff;--lime:#b6ff3b;--gold:#ffd23d;
  --a0:#ff3d6e;--a0d:#a8133b;--a1:#3d8bff;--a1d:#1a4cad;--a2:#ffb81f;--a2d:#a86f00;--a3:#1fd39a;--a3d:#0b7e58;
  --a4:#a35bff;--a4d:#5e23a8;--a5:#1fbfe0;--a5d:#0b6f86;--a6:#ff5fd2;--a6d:#a01f83;--a7:#8fcc1f;--a7d:#527a08;
  --good:#1fd39a;--bad:#ff3d6e;--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Outfit',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
b{font-weight:800}

/* ---------- animated arcade background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 800px at 5% -10%,#2a1170 0%,transparent 60%),radial-gradient(900px 700px at 110% 110%,#5a0f4f 0%,transparent 60%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;animation:orb 16s ease-in-out infinite alternate}
.orb.o1{width:42vmax;height:42vmax;background:var(--pink);left:-14vmax;top:35%}
.orb.o2{width:36vmax;height:36vmax;background:var(--cyan);right:-12vmax;top:-12vmax;opacity:.25;animation-delay:-7s}
@keyframes orb{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
.floor{position:absolute;left:-50%;right:-50%;bottom:-5%;height:55%;background-image:linear-gradient(rgba(138,61,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(138,61,255,.35) 1px,transparent 1px);background-size:56px 56px;transform:perspective(420px) rotateX(64deg);transform-origin:bottom;animation:gridmove 3s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%);opacity:.55}
@keyframes gridmove{to{background-position:0 56px}}

/* ---------- typography ---------- */
.logo{font-family:'Bungee',sans-serif;font-size:clamp(46px,13vw,96px);line-height:.92;display:flex;flex-direction:column;align-items:center;letter-spacing:1px}
.logo .l1{color:#fff;text-shadow:0 0 22px rgba(34,228,255,.75),4px 4px 0 var(--violet)}
.logo .l2{background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(4px 4px 0 #3a0f6b)}
.logo.sm{font-size:20px;flex-direction:row;gap:6px}
.logo.sm .l1,.logo.sm .l2{filter:none;text-shadow:none}
.tag{color:var(--muted);text-align:center;font-weight:600;max-width:420px}
.h1{font-family:'Bungee',sans-serif;font-weight:400;font-size:clamp(26px,5vw,46px);line-height:1.1}
.h2{font-size:20px;font-weight:900}
.glow{text-shadow:0 0 24px rgba(255,61,154,.6)}
.center-text{text-align:center}
.muted{color:var(--muted)}
.sm{font-size:13px}
.up{text-transform:uppercase;letter-spacing:.14em;font-weight:800;font-size:13px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}

/* ---------- layout ---------- */
.screen{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px 16px}
.page{min-height:100svh;display:flex;flex-direction:column;padding:14px 16px 24px;gap:16px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-right:48px;min-height:44px}
.wrap{width:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap.narrow{max-width:780px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.tight{gap:6px}
.center-row{justify-content:center;margin-top:18px}
.head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.center-page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px}
.pill.gold{background:rgba(255,210,61,.16);border-color:rgba(255,210,61,.5);color:var(--gold)}
.fade{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}}

/* ---------- inputs & buttons ---------- */
.inp{width:100%;background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,228,255,.15)}
.inp::placeholder{color:rgba(255,255,255,.35)}
.code-inp{font-family:'Bungee',sans-serif;font-size:34px;text-align:center;letter-spacing:.35em;text-transform:uppercase;padding:10px 10px 10px 22px}
.title-inp{font-size:22px;font-weight:800}
textarea.inp{resize:vertical;line-height:1.35}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card2);padding:12px 18px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;-webkit-user-select:none;user-select:none;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.btn.primary{border:none;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 5px 0 #4a1590,0 12px 28px rgba(255,61,154,.3)}
.btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #4a1590,0 6px 14px rgba(255,61,154,.3)}
.btn.ghost{background:transparent}
.btn.danger{color:#ff9fb9}
.btn.big{font-size:19px;padding:16px 28px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;font-weight:800}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn.danger{color:#ff9fb9}
#muteBtn{position:fixed;top:12px;right:12px;z-index:90;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(20,14,55,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;font-size:18px}

/* ---------- home ---------- */
.join-card{width:100%;max-width:410px;display:flex;flex-direction:column;gap:8px}
.join-card .btn{margin-top:12px}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.av{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.06);font-size:21px;cursor:pointer;transition:transform .12s}
.av.sel{border-color:var(--gold);background:rgba(255,210,61,.16);transform:scale(1.1)}

/* ---------- packets & editor ---------- */
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pack{display:flex;flex-direction:column;gap:10px}
.pack-title{font-weight:900;font-size:19px;line-height:1.2}
.empty{color:var(--muted);padding:30px;text-align:center;border:2px dashed var(--line);border-radius:var(--r)}
.qcard{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qnum{font-family:'Bungee',sans-serif;font-size:20px;color:var(--cyan)}
.sel{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-weight:700}
.sel option{background:#1a1440}
.dbl{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;padding:6px 10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.dbl.on{background:rgba(255,210,61,.18);border-color:var(--gold);color:var(--gold)}
.dbl input{accent-color:var(--gold)}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--c) 20%,transparent);border:2px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:12px;padding:5px 6px 5px 12px;transition:background .15s,border-color .15s}
.choice .shape{color:var(--c);font-size:18px}
.choice.correct{background:color-mix(in srgb,var(--c) 42%,transparent);border-color:#fff}
.choice.correct .shape{color:#fff}
.cinp{flex:1;min-width:0;background:transparent;border:none;outline:none;padding:9px 0;font-weight:700}
.cinp::placeholder{color:rgba(255,255,255,.4);font-weight:500}
.mark{width:34px;height:34px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:transparent;cursor:pointer;font-weight:900;color:#fff}
.choice.correct .mark{background:var(--good);border-color:#fff}
.hint{font-size:13px;color:var(--muted)}

/* answer colours */
.a0{--c:var(--a0);--cd:var(--a0d)}.a1{--c:var(--a1);--cd:var(--a1d)}.a2{--c:var(--a2);--cd:var(--a2d)}.a3{--c:var(--a3);--cd:var(--a3d)}
.a4{--c:var(--a4);--cd:var(--a4d)}.a5{--c:var(--a5);--cd:var(--a5d)}.a6{--c:var(--a6);--cd:var(--a6d)}.a7{--c:var(--a7);--cd:var(--a7d)}
.shape{font-variant-emoji:text;line-height:1}

/* ---------- host lobby ---------- */
.lobby{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:16px;flex:1;width:100%;max-width:1200px;margin:0 auto}
.lobby-join{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.big-code{font-family:'Bungee',sans-serif;font-size:clamp(58px,10vw,100px);letter-spacing:.12em;padding-left:.12em;line-height:1;background:linear-gradient(90deg,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(34,228,255,.35))}
.qr{background:#fff;padding:12px;border-radius:16px}
.qr:empty{display:none}
.qr img,.qr canvas{display:block;width:180px;height:180px}
.url{font-size:13px;color:var(--muted);word-break:break-all;max-width:340px}
.warn{font-size:13px;background:rgba(255,184,31,.12);border:1px solid rgba(255,184,31,.4);color:#ffd88a;padding:10px 12px;border-radius:12px;text-align:left;line-height:1.4}
.lobby-players{display:flex;flex-direction:column;gap:14px;min-height:320px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;align-content:start;flex:1}
.pchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:10px}
.pchip.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.pchip.off{opacity:.42}
.pav{font-size:24px;line-height:1}
.pchip .pname{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kick{border:none;background:none;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s;font-weight:900;padding:2px 4px}
.pchip:hover .kick{opacity:1}
@media (hover:none){.kick{opacity:.7}}
.waiting{color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px;justify-content:center;grid-column:1/-1;padding:20px 0}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ---------- host game ---------- */
.host-ctrl{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.cd{font-family:'Bungee',sans-serif;font-size:clamp(130px,30vw,260px);line-height:1;color:var(--gold);text-shadow:0 0 50px rgba(255,210,61,.5)}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.double-badge{font-family:'Bungee',sans-serif;font-size:22px;color:#1a1000;background:linear-gradient(90deg,var(--gold),#ff9a3d);padding:8px 18px;border-radius:12px;animation:wobble 1s ease-in-out infinite alternate}
@keyframes wobble{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.06)}}
.qwrap{display:flex;align-items:center;justify-content:center;padding:22px;min-height:20vh;text-align:center}
.qtext-big{font-size:clamp(22px,4vw,50px);font-weight:900;line-height:1.18;max-width:1100px}
.qtext-big.sm{font-size:clamp(18px,2.6vw,30px)}
.timer-wrap{position:relative;width:76px;height:76px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:rgba(0,0,0,.35);stroke:rgba(255,255,255,.12);stroke-width:4}
.ring-fg{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .3s}
.ring-fg.hurry{stroke:var(--pink)}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bungee',sans-serif;font-size:26px}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:1300px;margin:0 auto}
.ans{background:var(--c);border-radius:16px;box-shadow:0 6px 0 var(--cd);display:flex;align-items:center;gap:16px;padding:18px 22px;font-weight:800;font-size:clamp(17px,2.4vw,30px);min-height:84px;transition:opacity .4s,filter .4s;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.ans .shape{font-size:1.2em;flex:none}
.ans .atxt{flex:1;line-height:1.2;word-break:break-word}
.ans .acount{font-family:'Bungee',sans-serif;font-size:.9em;background:rgba(0,0,0,.22);border-radius:10px;padding:2px 10px}
.ans-grid.reveal .ans.dim{opacity:.28;filter:grayscale(.6)}
.ans-grid.reveal .ans.correct{outline:4px solid #fff;outline-offset:2px;animation:glowp 1s ease-in-out infinite alternate}
@keyframes glowp{to{box-shadow:0 6px 0 var(--cd),0 0 40px var(--c)}}
.answered-row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;min-height:34px}
.answered-row span{font-size:24px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.bars{display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,4vw,44px);height:210px}
.barcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:clamp(58px,12vw,120px);transition:opacity .4s}
.bar{width:100%;height:max(8px,calc(var(--h) * 150px));background:var(--c);border-radius:10px 10px 0 0;box-shadow:inset 0 -6px 0 var(--cd);animation:grow .9s cubic-bezier(.2,1,.3,1) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(0)}}
.bcount{font-family:'Bungee',sans-serif;font-size:26px;margin-bottom:6px}
.blabel{background:var(--cd);width:100%;text-align:center;padding:7px 0;border-radius:0 0 10px 10px;font-weight:900;font-size:18px}
.barcol.lose{opacity:.38}

/* ---------- leaderboard ---------- */
.lb{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.lbrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;animation:slidein .55s cubic-bezier(.2,1,.3,1) both;animation-delay:var(--d,0ms)}
@keyframes slidein{from{opacity:0;transform:translateX(-36px)}}
.lbrank{font-family:'Bungee',sans-serif;font-size:22px;width:38px;text-align:center;color:var(--muted);flex:none}
.top1{border-color:rgba(255,210,61,.65);background:linear-gradient(90deg,rgba(255,210,61,.2),var(--card))}
.top2{border-color:rgba(220,225,255,.45)}
.top3{border-color:rgba(255,154,90,.5)}
.top1 .lbrank{color:var(--gold)}.top2 .lbrank{color:#dfe3ff}.top3 .lbrank{color:#ff9a5a}
.lbav{font-size:28px;flex:none}
.lbmain{flex:1;min-width:0}
.lbname{font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fire{font-size:14px;color:#ffb36b}
.lbbar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.lbbar span{display:block;height:100%;width:calc(var(--w) * 100%);background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:6px;animation:barw 1.1s .35s cubic-bezier(.2,1,.3,1) both}
@keyframes barw{from{width:0}}
.lbright{text-align:right;flex:none}
.lbscore{font-family:'Bungee',sans-serif;font-size:20px}
.lbdelta{font-size:13px;color:var(--muted);font-weight:800;display:flex;gap:8px;justify-content:flex-end}
.lbdelta .pos{color:var(--lime)}
.mv-up{color:var(--lime)}.mv-down{color:var(--pink)}
@media (min-width:1100px){.lb.two{display:grid;grid-auto-flow:column;grid-template-columns:1fr 1fr;max-width:1300px;column-gap:14px}}

/* ---------- podium ---------- */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2vw,16px);margin-top:10px}
.pod{display:flex;flex-direction:column;align-items:center;width:clamp(96px,22vw,210px);animation:rise 1s cubic-bezier(.2,1.4,.4,1) both}
.pod.p1{animation-delay:1.3s}.pod.p2{animation-delay:.7s}.pod.p3{animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(70px)}}
.pod-crown{font-size:clamp(24px,4vw,40px);animation:wobble 1s ease-in-out infinite alternate}
.pod-av{font-size:clamp(42px,7vw,76px);line-height:1.1}
.pod-name{font-weight:900;font-size:clamp(14px,2vw,22px);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-score{color:var(--muted);font-weight:800;margin-bottom:8px}
.pod-block{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font-family:'Bungee',sans-serif;font-size:clamp(34px,6vw,66px);box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.p1 .pod-block{height:clamp(140px,24vh,250px);background:linear-gradient(180deg,var(--gold),#c98a00);color:#3a2700}
.p2 .pod-block{height:clamp(100px,17vh,175px);background:linear-gradient(180deg,#eef0ff,#8d93b8);color:#2a2550}
.p3 .pod-block{height:clamp(70px,12vh,125px);background:linear-gradient(180deg,#ffab72,#b3511b);color:#3a1600}
.pod.empty{visibility:hidden}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- player ---------- */
.page.player{max-width:560px;margin:0 auto;height:100svh;min-height:0}
.ptop{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-right:48px}
.ptop .pname{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pscore{font-family:'Bungee',sans-serif;font-size:14px;color:var(--gold)}
.big-av{font-size:100px;line-height:1}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-14px) rotate(-4deg)}}
.spin{width:52px;height:52px;border:5px solid rgba(255,255,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pq-head{display:flex;justify-content:space-between;align-items:center}
.ptime{font-family:'Bungee',sans-serif;font-size:24px}
.tbar{height:10px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden;flex:none}
.tbar span{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));transform-origin:left;transition:transform .1s linear}

<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="floor"></div></div>
<button id="muteBtn" data-act="mute" title="Sound on/off">🔊</button>
<div id="app"></div>
<div id="toasts"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   CONSTANTS & HELPERS
   ===================================================================== */
const PREFIX = 'trivblitz-v1-';
const MAX_PLAYERS = 15;
const SHAPES = ['▲', '◆', '●', '■', '★', '▼', '✚', '♠'];
const MULTI_MAX = 8;
const TIMES = [5, 10, 15, 20, 30, 45, 60, 90];
const AVATARS = ['🦊','🐸','🐼','🦄','🐙','🦖','🐯','🐵','🐧','🦉','🐳','🍕','👾','🚀','🔥','⚡'];
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const PeerCtor = window.Peer || (window.peerjs && (window.peerjs.Peer || window.peerjs.default)) || null;

const $app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const ordinal = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const fmt = n => Number(n || 0).toLocaleString();
const dots = '<span class="dots"><i></i><i></i><i></i></span>';
const render = html => { $app.innerHTML = html; window.scrollTo(0, 0); };

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const sess = {
  get(k, d) { try { const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
};

function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2800);
  setTimeout(() => t.remove(), 3200);
}
function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
async function wake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }

/* ---------- sound (WebAudio chiptune blips) ---------- */
let AC = null, muted = store.get('tb_muted', false);
function syncMute() { $('muteBtn').textContent = muted ? '🔇' : '🔊'; }
syncMute();
function snd(kind) {
  if (muted) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { return; }
  const T = (f, d, type = 'square', v = .06, dl = 0) => {
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + dl;
    o.type = type; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + .03);
  };
  switch (kind) {
    case 'tick': T(880, .06, 'square', .035); break;
    case 'go': T(523, .1); T(784, .18, 'square', .06, .1); break;
    case 'pop': T(660, .06, 'triangle', .08); break;
    case 'tap': T(520, .05, 'triangle', .07); break;
    case 'join': [523, 659, 784].forEach((f, i) => T(f, .1, 'triangle', .08, i * .07)); break;
    case 'reveal': T(392, .12, 'sawtooth', .045); T(523, .25, 'sawtooth', .045, .12); break;
    case 'correct': [523, 659, 784, 1047].forEach((f, i) => T(f, .13, 'square', .05, i * .08)); break;
    case 'wrong': T(220, .25, 'sawtooth', .06); T(160, .4, 'sawtooth', .06, .2); break;
    case 'fanfare': [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => T(f, .2, 'square', .05, i * .14)); break;
  }
}
document.addEventListener('pointerdown', () => { if (!AC && !muted) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }, { once: true });

/* ---------- confetti ---------- */
function confetti() {
  const cv = $('confetti'); if (!cv) return;
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ff3d9a', '#22e4ff', '#b6ff3b', '#ffd23d', '#8a3dff', '#ff7a3d'];
  const parts = Array.from({ length: 170 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height,
    vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: 5 + Math.random() * 7,
    a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[Math.random() * cols.length | 0]
  }));
  const start = performance.now();
  (function loop(t) {
    if (!document.body.contains(cv)) return;
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      if (p.y > cv.height + 20 && t - start < 5000) { p.y = -20; p.x = Math.random() * cv.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore();
    }
    if (t - start < 10000) requestAnimationFrame(loop); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(start);
}

function send(conn, m) { try { if (conn && conn.open) conn.send(m); } catch (e) {} }

/* =====================================================================
   PACKETS (stored in this browser)
   ===================================================================== */
const SAMPLE = {
  title: 'Sample Packet: General Knowledge',
  questions: [
    { text: 'What is the largest planet in our solar system?', choices: ['Mars', 'Jupiter', 'Saturn', 'Neptune'], correct: 1, time: 20 },
    { text: 'How many sides does a hexagon have?', choices: ['5', '6', '7', '8'], correct: 1, time: 15 },
    { text: 'Which element has the chemical symbol "Fe"?', choices: ['Iron', 'Fluorine', 'Lead', 'Francium'], correct: 0, time: 15 },
    { text: 'True or false: Lightning never strikes the same place twice.', choices: ['True', 'False'], correct: 1, time: 10 },
    { text: 'In what year did humans first walk on the Moon?', choices: ['1965', '1969', '1972', '1975'], correct: 1, time: 20 },
    { type: 'text', text: 'What is the capital city of Australia?', accept: 'Canberra', time: 30 },
    { text: 'What is the hardest natural substance on Earth?', choices: ['Quartz', 'Titanium', 'Diamond', 'Granite'], correct: 2, time: 15 },
    { text: 'Which ocean is the largest?', choices: ['Atlantic', 'Indian', 'Arctic', 'Pacific'], correct: 3, time: 15, double: true }
  ]
};
function normQ(q) {
  q = q || {};
  const type = q.type === 'text' ? 'text' : q.type === 'multi' ? 'multi' : 'mc';
  // Always keep 8 answer slots; regular multiple choice only uses the first 4.
  const choices = (Array.isArray(q.choices) ? q.choices : []).map(c => String(c ?? '')).slice(0, MULTI_MAX);
  while (choices.length < MULTI_MAX) choices.push('');
  let correct = Number.isInteger(q.correct) ? q.correct : 0;
  let corrects = Array.isArray(q.corrects)
    ? [...new Set(q.corrects.map(Number).filter(n => Number.isInteger(n) && n >= 0 && n < MULTI_MAX))].sort((a, b) => a - b)
    : (type === 'multi' && correct >= 0 && correct < MULTI_MAX ? [correct] : []);
  if (correct < 0 || correct > 3) correct = 0;
  const time = TIMES.includes(+q.time) ? +q.time : 20;
  const accept = Array.isArray(q.accept) ? q.accept.join('\n') : String(q.accept || '');
  return { type, text: String(q.text || ''), choices, correct, corrects, time, double: !!q.double, accept };
}
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
function normPacket(p) {
  return { id: p.id || uid(), title: String(p.title || 'Untitled packet').slice(0, 80), questions: (p.questions || []).map(normQ) };
}
function getPackets() {
  let p = store.get('tb_packets', null);
  if (!Array.isArray(p)) { p = [normPacket(SAMPLE)]; store.set('tb_packets', p); }
  return p.map(normPacket);
}
function savePackets(p) { store.set('tb_packets', p); }
function validate(p) {
  const errs = [];
  if (!p.questions.length) errs.push('Add at least one question first.');
  p.questions.forEach((q, i) => {
    if (!q.text.trim()) errs.push(`Q${i + 1}: question text is empty`);
    if (q.type === 'text') { if (!acceptList(q.accept).length) errs.push(`Q${i + 1}: add at least one accepted answer`); return; }
    if (q.type === 'multi') {
      if (q.choices.filter(c => c.trim()).length < 2) errs.push(`Q${i + 1}: needs at least 2 answers`);
      if (!q.corrects.length) errs.push(`Q${i + 1}: mark at least one answer as correct`);
      else if (q.corrects.some(j => !(q.choices[j] || '').trim())) errs.push(`Q${i + 1}: an answer marked correct is blank`);
      return;
    }
    if (q.choices.slice(0, 4).filter(c => c.trim()).length < 2) errs.push(`Q${i + 1}: needs at least 2 answers`);
    if (!(q.choices[q.correct] || '').trim()) errs.push(`Q${i + 1}: the answer marked correct is blank`);
  });
  return errs;
}
// Strip blank answer slots for play, but keep each answer's colour/shape slot.
function compile(q) {
  if (q.type === 'text') return { type: 'text', text: q.text.trim(), accept: acceptList(q.accept), choices: [], shapes: [], correct: -1, time: q.time, double: q.double };
  const idx = []; q.choices.slice(0, q.type === 'multi' ? MULTI_MAX : 4).forEach((c, j) => { if (c.trim()) idx.push(j); });
  if (q.type === 'multi') return { type: 'multi', text: q.text.trim(), choices: idx.map(j => q.choices[j].trim()), shapes: idx, correct: -1,
    corrects: q.corrects.map(j => idx.indexOf(j)).filter(j => j >= 0), time: q.time, double: q.double };
  return { type: 'mc', text: q.text.trim(), choices: idx.map(j => q.choices[j].trim()), shapes: idx, correct: idx.indexOf(q.correct), time: q.time, double: q.double };
}
/* ---------- write-in auto-grading ---------- */
const acceptList = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
function normAns(s) {
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/&/g, ' and ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim()
    .replace(/^(the|a|an) /, '');
}
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length; if (!m || !n) return m || n;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
// Forgives case, punctuation, accents, a leading "the/a/an", and small typos (not in numbers).
function autoGrade(guess, accept) {
  const g = normAns(guess); if (!g) return false;
  const gs = g.replace(/ /g, '');
  return accept.some(raw => {
    const n = normAns(raw); if (!n) return false;
    const ns = n.replace(/ /g, '');
    if (gs === ns) return true;
    if (/\d/.test(ns)) return false;
    if (n.length >= 4 && g.split(' ').length <= n.split(' ').length + 2 && (' ' + g + ' ').includes(' ' + n + ' ')) return true;
    const tol = ns.length >= 9 ? 2 : ns.length >= 5 ? 1 : 0;
    return lev(gs, ns) <= tol;
  });
}

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* =====================================================================
   HOST: GAME ENGINE
   ===================================================================== */
let H = null;

function genCode() { let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.random() * CODE_CHARS.length | 0]; return s; }
function activeCount() { return [...H.players.values()].filter(p => p.connected).length; }
function ranked() {
  const arr = [...H.players.values()].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  let r = 0, prev = null;
  arr.forEach((p, i) => { if (p.score !== prev) { r = i + 1; prev = p.score; } p.rank = r; });
  return arr;
}
function bcast(m) { for (const p of H.players.values()) if (p.connected) send(p.conn, m); }

function startHosting(packet) {
  const errs = validate(packet);
  if (errs.length) { toast(errs[0], 'bad'); return; }
  if (!PeerCtor) { toast('Could not load the networking library. Check your internet connection and reload.', 'bad'); return; }
  H = { packet, qs: packet.questions.map(compile), code: null, peer: null, players: new Map(), shown: new Set(),
        phase: 'opening', qi: -1, answers: new Map(), qStart: 0 };
  render(`<div class="screen fade"><div class="spin"></div><div class="muted">Opening a room…</div></div>`);
  openRoom(0);
}

function openRoom(tries) {
  const code = genCode();
  const peer = new PeerCtor(PREFIX + code, { debug: 0 });
  H.code = code; H.peer = peer;
  peer.on('open', () => { if (!H || H.peer !== peer) return; H.phase = 'lobby'; screenHostLobby(); wake(); });
  peer.on('connection', conn => hostConn(conn));
  peer.on('disconnected', () => { setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} }, 1000); });
  peer.on('error', err => {
    if (!H || H.peer !== peer) return;
    if (err.type === 'unavailable-id' && tries < 6) { peer.destroy(); openRoom(tries + 1); }
    else if (H.phase === 'opening') {
      render(`<div class="screen fade"><div style="font-size:64px">📡</div><h1 class="h1">Couldn't open a room</h1>
        <p class="muted center-text">The connection service didn't respond (${esc(err.type || 'error')}). Check your internet connection and try again.</p>
        <button class="btn primary" data-act="hostHome">Back to packets</button></div>`);
      H = null;
    } else console.warn('peer error', err);
  });
}

function hostConn(conn) {
  conn.on('data', msg => hostMsg(conn, msg));
  conn.on('close', () => hostDrop(conn));
  conn.on('error', () => hostDrop(conn));
}
function hostDrop(conn) {
  if (!H) return;
  for (const p of H.players.values()) {
    if (p.conn === conn) { p.connected = false; p.conn = null; refreshHost(); checkAllIn(); }
  }
}
function reject(conn, reason) { send(conn, { t: 'reject', reason }); setTimeout(() => { try { conn.close(); } catch (e) {} }, 600); }

function hostMsg(conn, msg) {
  if (!H || !msg || typeof msg !== 'object') return;
  if (msg.t === 'join') {
    const name = String(msg.name || '').trim().replace(/\s+/g, ' ').slice(0, 16);
    const avatar = AVATARS.includes(msg.avatar) ? msg.avatar : '👾';
    if (!name) return reject(conn, 'Please enter a name.');
    const key = name.toLowerCase();
    let p = H.players.get(key);
    if (p) {
      if (p.connected && p.token !== msg.token) return reject(conn, 'That name is already taken — try another.');
      if (p.conn && p.conn !== conn) { const old = p.conn; p.conn = null; try { old.close(); } catch (e) {} }
      Object.assign(p, { conn, connected: true, token: msg.token, avatar });
      if (H.phase !== 'lobby') toast(`${p.name} reconnected`);
    } else {
      if (H.phase === 'final') return reject(conn, 'This game has already ended.');
      if (H.players.size >= MAX_PLAYERS) return reject(conn, `The lobby is full (${MAX_PLAYERS} players max).`);
      p = { key, name, avatar, token: msg.token, conn, connected: true, score: 0, streak: 0, rank: 0, prevRank: 0,
            lastDelta: 0, lastOk: null, correctCount: 0 };
      H.players.set(key, p); snd('join');
      if (H.phase !== 'lobby') toast(`${name} joined mid-game`);
    }
    conn.__key = key;
    send(conn, { t: 'welcome', name: p.name, avatar: p.avatar, title: H.packet.title });
    syncPlayer(p); refreshHost();
    if (H.phase === 'lobby') bcast({ t: 'lobby', count: H.players.size });
    return;
  }
  const p = H.players.get(conn.__key);
  if (!p || p.conn !== conn) return;
  if (msg.t === 'answer') {
    if (H.phase !== 'question' || msg.qi !== H.qi || H.answers.has(p.key)) return;
    const q = H.qs[H.qi];
    const ms = Date.now() - H.qStart;
    if (ms > q.time * 1000 + (q.type === 'mc' ? 600 : 1500)) return;
    if (q.type === 'multi') {
      if (!Array.isArray(msg.cs)) return;
      const cs = [...new Set(msg.cs.map(Number))].filter(c => Number.isInteger(c) && c >= 0 && c < q.choices.length).sort((a, b) => a - b);
      if (!cs.length) return;
      H.answers.set(p.key, { cs, ms });
      send(conn, { t: 'locked', qi: H.qi, cs, shapes: cs.map(c => q.shapes[c]) });
    } else if (q.type === 'text') {
      const txt = String(msg.txt || '').trim().replace(/\s+/g, ' ').slice(0, 60);
      if (!txt) return;
      H.answers.set(p.key, { txt, ms });
      send(conn, { t: 'locked', qi: H.qi, txt });
    } else {
      const c = msg.c | 0;
      if (c < 0 || c >= q.choices.length) return;
      H.answers.set(p.key, { c, ms });
      send(conn, { t: 'locked', qi: H.qi, c });
    }
    snd('pop'); updateHostQ(p); checkAllIn();
  } else if (msg.t === 'leave') {
    if (H.phase === 'lobby') { H.players.delete(p.key); H.shown.delete(p.key); bcast({ t: 'lobby', count: H.players.size }); }
    else { p.connected = false; p.conn = null; }
    refreshHost(); checkAllIn();
  }
}

function checkAllIn() {
  if (!H || H.phase !== 'question') return;
  const active = [...H.players.values()].filter(p => p.connected);
  if (active.length && active.every(p => H.answers.has(p.key))) {
    clearTimeout(H.allIn);
    H.allIn = setTimeout(() => { if (H && H.phase === 'question') endQuestion(); }, 700);
  }
}

function qMsg(elapsed) {
  const q = H.qs[H.qi];
  return { t: 'question', type: q.type, qi: H.qi, total: H.qs.length, text: q.text, choices: q.choices, shapes: q.shapes,
           time: q.time, remaining: Math.max(0, q.time * 1000 - elapsed), double: q.double };
}
function resultMsg(p) {
  const q = H.qs[H.qi];
  if (q.type === 'multi') {
    const label = i => SHAPES[q.shapes[i]] + ' ' + q.choices[i], a = H.answers.get(p.key);
    return { t: 'result', qi: H.qi, ok: p.lastOk, delta: p.lastDelta, score: p.score, streak: p.streak, rank: p.rank,
             total: H.players.size, type: q.type, answer: q.corrects.map(label).join(', '), shape: null,
             yours: a ? a.cs.map(label).join(', ') : '' };
  }
  return { t: 'result', qi: H.qi, ok: p.lastOk, delta: p.lastDelta, score: p.score, streak: p.streak, rank: p.rank,
           total: H.players.size, type: q.type,
           answer: q.type === 'text' ? q.accept[0] : q.choices[q.correct], shape: q.type === 'text' ? null : q.shapes[q.correct],
           yours: (H.answers.get(p.key) || {}).txt || '' };
}
function standMsg(p, arr) {
  const i = arr.indexOf(p), above = i > 0 ? arr[i - 1] : null;
  return { t: 'stand', rank: p.rank, score: p.score, total: arr.length,
           gap: above && above.score > p.score ? above.score - p.score : 0, aboveName: above ? above.name : '',
           last: H.qi >= H.qs.length - 1 };
}
function finalMsg(p) { return { t: 'final', rank: p.rank, score: p.score, total: H.players.size, correct: p.correctCount, qcount: H.qs.length }; }

function syncPlayer(p) {
  switch (H.phase) {
    case 'lobby': send(p.conn, { t: 'lobby', count: H.players.size }); break;
    case 'getready': send(p.conn, { t: 'getready', qi: H.qi, total: H.qs.length, double: H.qs[H.qi].double }); break;
    case 'question': {
      const a = H.answers.get(p.key);
      send(p.conn, !a ? qMsg(Date.now() - H.qStart) : a.txt != null ? { t: 'locked', qi: H.qi, txt: a.txt }
        : a.cs ? { t: 'locked', qi: H.qi, cs: a.cs, shapes: a.cs.map(c => H.qs[H.qi].shapes[c]) } : { t: 'locked', qi: H.qi, c: a.c, shape: H.qs[H.qi].shapes[a.c] });
      break;
    }
    case 'judge': send(p.conn, { t: 'judging' }); break;
    case 'reveal': send(p.conn, resultMsg(p)); break;
    case 'leaderboard': send(p.conn, standMsg(p, ranked())); break;
    case 'final': ranked(); send(p.conn, finalMsg(p)); break;
  }
}

function refreshHost() {
  if (!H) return;
  if (H.phase === 'lobby') renderPlist();
  else if (H.phase === 'question') updateHostQ();
}

function startGame() {
  if (!H.players.size) { toast('Wait for at least one player to join', 'bad'); return; }
  H.qi = -1; nextQuestion();
}

function nextQuestion() {
  clearInterval(H.cd); clearInterval(H.tick);
  H.qi++;
  if (H.qi >= H.qs.length) return showFinal();
  H.answers = new Map(); H.phase = 'getready';
  const q = H.qs[H.qi];
  bcast({ t: 'getready', qi: H.qi, total: H.qs.length, double: q.double });
  render(`<div class="page center-page fade">
    <div class="up muted" style="font-size:18px">Question ${H.qi + 1} of ${H.qs.length}</div>
    ${q.double ? '<div class="double-badge">2× POINTS</div>' : ''}
    <div id="cdNum" class="cd pop">3</div><div class="muted" style="font-weight:700">Get ready…</div></div>`);
  let n = 3; snd('tick');
  H.cd = setInterval(() => {
    n--;
    if (n > 0) { const el = $('cdNum'); if (el) { el.textContent = n; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } snd('tick'); }
    else { clearInterval(H.cd); beginQuestion(); }
  }, 1000);
}

function beginQuestion() {
  H.phase = 'question'; H.qStart = Date.now();
  const q = H.qs[H.qi];
  bcast(qMsg(0)); snd('go');
  render(`<div class="page fade">
    <div class="topbar">
      <div class="pill">Q ${H.qi + 1}/${H.qs.length}${q.double ? ' · <span style="color:var(--gold)">2× POINTS</span>' : ''}</div>
      <div class="timer-wrap"><svg viewBox="0 0 44 44" class="ring"><circle cx="22" cy="22" r="19" class="ring-bg"/><circle id="ringFg" cx="22" cy="22" r="19" class="ring-fg"/></svg><span id="tnum" class="tnum">${q.time}</span></div>
      <div class="pill"><span id="acount">0</span>&nbsp;/&nbsp;<span id="atotal">${activeCount()}</span>&nbsp;answered</div>
    </div>
    <div class="qwrap card"><div class="qtext-big">${esc(q.text)}</div></div>
    ${q.type === 'multi' ? '<div class="center-text"><span class="pill gold">☑ Select ALL that apply</span></div>' : ''}
    <div id="answeredRow" class="answered-row"></div>
    ${q.type === 'text' ? '<div class="writein-host"><div class="wi-icon">✍️</div><div>Write your answer on your phone</div></div>'
      : `<div class="ans-grid ${q.choices.length > 4 ? 'many' : ''}">${q.choices.map((c, i) => `<div class="ans a${q.shapes[i]}"><span class="shape">${SHAPES[q.shapes[i]]}</span><span class="atxt">${esc(c)}</span></div>`).join('')}</div>`}
    <div class="host-ctrl"><button class="btn sm" data-act="next">⏭ Stop timer</button><button class="btn ghost sm" data-act="endGame">End game</button></div>
  </div>`);
  const total = q.time * 1000; let lastSec = null;
  const C = 2 * Math.PI * 19;
  H.tick = setInterval(() => {
    const left = total - (Date.now() - H.qStart);
    const s = Math.max(0, Math.ceil(left / 1000));
    const t = $('tnum'), r = $('ringFg');
    if (t) t.textContent = s;
    if (r) { r.style.strokeDasharray = C; r.style.strokeDashoffset = C * (1 - Math.max(0, left) / total); r.classList.toggle('hurry', s <= 5); }
    if (s <= 5 && s > 0 && s !== lastSec) { lastSec = s; snd('tick'); }
    if (left <= 0) endQuestion();
  }, 100);
}

function updateHostQ(p) {
  const a = $('acount'); if (a) a.textContent = H.answers.size;
  const t = $('atotal'); if (t) t.textContent = activeCount();
  const row = $('answeredRow');
  if (row && p) { const s = document.createElement('span'); s.textContent = p.avatar; s.title = p.name; row.appendChild(s); }
}

function endQuestion() {
  if (!H || H.phase !== 'question') return;
  clearInterval(H.tick); clearTimeout(H.allIn);
  const q = H.qs[H.qi];
  if (q.type === 'text') return startJudging();
  const multi = q.type === 'multi';
  const isCorrect = i => multi ? q.corrects.includes(i) : i === q.correct;
  scoreQuestion(a => multi ? sameSet(a.cs, q.corrects) : a.c === q.correct);

  const counts = q.choices.map(() => 0);
  for (const a of H.answers.values()) { if (multi) a.cs.forEach(c => counts[c]++); else counts[a.c]++; }
  const max = Math.max(1, ...counts);
  const nOk = multi ? [...H.players.values()].filter(p => p.lastOk).length : counts[q.correct];
  const many = q.choices.length > 4 ? 'many' : '';
  render(`<div class="page fade">
    <div class="topbar"><div class="pill">Q ${H.qi + 1}/${H.qs.length}</div><div class="pill">✓ ${nOk} of ${H.players.size} got ${multi ? 'them all' : 'it'} right</div><span></span></div>
    <div class="qwrap"><div class="qtext-big sm">${esc(q.text)}</div></div>
    <div class="bars ${many}">${q.choices.map((c, i) => `
      <div class="barcol ${isCorrect(i) ? 'win' : 'lose'}"><div class="bcount">${counts[i]}</div>
        <div class="bar a${q.shapes[i]}" style="--h:${counts[i] / max}"></div>
        <div class="blabel a${q.shapes[i]}">${SHAPES[q.shapes[i]]}${isCorrect(i) ? ' ✓' : ''}</div></div>`).join('')}
    </div>
    <div class="ans-grid reveal ${many}">${q.choices.map((c, i) => `<div class="ans a${q.shapes[i]} ${isCorrect(i) ? 'correct' : 'dim'}"><span class="shape">${SHAPES[q.shapes[i]]}</span><span class="atxt">${esc(c)}</span>${isCorrect(i) ? '<span class="shape">✓</span>' : ''}</div>`).join('')}</div>
    <div class="host-ctrl"><button class="btn primary big" data-act="next">Leaderboard →</button></div>
  </div>`);
}

// Award points: isOk(answer) decides correctness for each submitted answer.
function scoreQuestion(isOk) {
  const q = H.qs[H.qi], limit = q.time * 1000;
  ranked().forEach(p => p.prevRank = p.rank);
  for (const p of H.players.values()) {
    const a = H.answers.get(p.key);
    let delta = 0, ok = null;
    if (a) {
      ok = !!isOk(a, p);
      if (ok) {
        p.streak++; p.correctCount++;
        const base = q.double ? 2000 : 1000;
        delta = Math.round(base * (1 - Math.min(a.ms, limit) / limit / 2)) + Math.min(p.streak - 1, 5) * 100;
      } else p.streak = 0;
    } else p.streak = 0;
    p.score += delta; p.lastDelta = delta; p.lastOk = ok;
  }
  ranked();
  H.phase = 'reveal';
  for (const p of H.players.values()) if (p.connected) send(p.conn, resultMsg(p));
  snd('reveal');
}

// Write-in: after time's up the host sees every player's answer by name,
// auto-grading only *suggests* a call, and the host confirms ✓ / ✕ for each.
function startJudging() {
  const q = H.qs[H.qi];
  H.marks = new Map();
  for (const [key, a] of H.answers) {
    a.g = normAns(a.txt) || a.txt.toLowerCase();
    H.marks.set(key, { ok: autoGrade(a.txt, q.accept), confirmed: false });
  }
  // answered players first (fastest first), then players with no answer
  H.judgeOrder = [...H.players.values()].sort((x, y) => {
    const ax = H.answers.get(x.key), ay = H.answers.get(y.key);
    if (!!ax !== !!ay) return ax ? -1 : 1;
    return ax ? ax.ms - ay.ms : x.name.localeCompare(y.name);
  }).map(p => p.key);
  H.phase = 'judge';
  bcast({ t: 'judging' });
  renderJudge(true);
}
function judgeCounts() {
  let ok = 0, no = 0, pending = 0;
  for (const m of H.marks.values()) { if (m.ok) ok++; else no++; if (!m.confirmed) pending++; }
  return { ok, no, pending };
}
function renderJudge(first) {
  const q = H.qs[H.qi], y = scrollY, c = judgeCounts();
  const showKey = store.get('tb_showkey', true);
  const cards = H.judgeOrder.map((key, i) => {
    const p = H.players.get(key); if (!p) return '';
    const a = H.answers.get(key), m = H.marks.get(key);
    if (!a) return `<div class="jcard none" style="--d:${i * 50}ms"><div class="jc-top"><span class="pav">${p.avatar}</span><span class="jc-name">${esc(p.name)}</span></div><div class="jc-ans muted">— no answer —</div><div class="jc-note">No points</div></div>`;
    return `<div class="jcard ${m.ok ? 'ok' : 'no'} ${m.confirmed ? 'confirmed' : 'pending'} ${first ? 'enter' : ''}" style="--d:${i * 60}ms">
      <div class="jc-top"><span class="pav">${p.avatar}</span><span class="jc-name">${esc(p.name)}</span><span class="jc-time">${(a.ms / 1000).toFixed(1)}s</span></div>
      <div class="jc-ans">“${esc(a.txt)}”</div>
      <div class="jc-btns">
        <button class="jb ok ${m.ok ? 'on' : ''}" data-act="judgeSet" data-k="${esc(key)}" data-v="1">✓ Points</button>
        <button class="jb no ${!m.ok ? 'on' : ''}" data-act="judgeSet" data-k="${esc(key)}" data-v="0">✕ No points</button>
      </div>
      <div class="jc-note">${m.confirmed ? (m.ok ? 'Confirmed: gets points' : 'Confirmed: no points') : `Suggested ${m.ok ? '✓' : '✕'} · tap to confirm`}</div>
    </div>`;
  }).join('');
  render(`<div class="page ${first ? 'fade' : ''}">
    <div class="topbar"><div class="pill">Q ${H.qi + 1}/${H.qs.length} · Write-in</div>
      <div class="row tight"><span class="pill">✓ ${c.ok}</span><span class="pill">✕ ${c.no}</span>${c.pending ? `<span class="pill gold">${c.pending} to confirm</span>` : '<span class="pill">All confirmed ✔</span>'}</div><span></span></div>
    <div class="wrap">
      <div class="answers-head">
        <h1 class="h1 glow">The answers are in!</h1>
        <div class="qtext-big sm">${esc(q.text)}</div>
      </div>
      <div class="card keybox">
        <div class="row" style="justify-content:space-between"><span class="up muted">Answer key</span>
          <button class="btn ghost sm" data-act="toggleKey">${showKey ? '🙈 Hide' : '👁 Show'}</button></div>
        ${showKey ? `<div class="accept-list">${q.accept.map(x => `<span class="pill gold">${esc(x)}</span>`).join('')}</div>` : '<div class="muted sm">Hidden, handy if this screen is on a projector.</div>'}
      </div>
      <p class="hint">Each answer has a suggested call from auto-grading. Tap ✓ or ✕ on every card to confirm it. Identical answers update together. Nobody gets points until you press <b>Award points</b>.</p>
      <div class="jgrid">${cards || '<div class="empty">No players.</div>'}</div>
      <div class="host-ctrl">
        ${c.pending ? `<button class="btn" data-act="judgeAcceptAll">Accept all ${c.pending} suggestion${c.pending === 1 ? '' : 's'}</button>` : ''}
        <button class="btn primary big" data-act="next" ${c.pending ? 'disabled title="Confirm every answer first"' : ''}>Award points →</button>
        <button class="btn ghost sm" data-act="endGame">End game</button>
      </div>
    </div>
  </div>`);
  if (!first) scrollTo(0, y);
}
function finishJudging() {
  if (judgeCounts().pending) { toast('Confirm every answer first (or tap "Accept all suggestions")', 'bad'); return; }
  const q = H.qs[H.qi];
  scoreQuestion((a, p) => (H.marks.get(p.key) || {}).ok);
  const nOk = [...H.players.values()].filter(p => p.lastOk).length;
  const cards = H.judgeOrder.map((key, i) => {
    const p = H.players.get(key), a = H.answers.get(key); if (!p) return '';
    const ok = !!p.lastOk;
    return `<div class="jcard small ${a ? (ok ? 'ok' : 'no') : 'none'} confirmed enter" style="--d:${300 + i * 70}ms">
      <div class="jc-top"><span class="pav">${p.avatar}</span><span class="jc-name">${esc(p.name)}</span><span class="jc-pts ${ok ? 'pos' : ''}">${ok ? '+' + fmt(p.lastDelta) : '+0'}</span></div>
      <div class="jc-ans ${a ? '' : 'muted'}">${a ? `${ok ? '✓' : '✕'} “${esc(a.txt)}”` : '— no answer —'}</div></div>`;
  }).join('');
  render(`<div class="page fade">
    <div class="topbar"><div class="pill">Q ${H.qi + 1}/${H.qs.length}</div><div class="pill">✓ ${nOk} of ${H.players.size} got it right</div><span></span></div>
    <div class="qwrap"><div class="qtext-big sm">${esc(q.text)}</div></div>
    <div class="answer-reveal"><div class="up muted">The answer</div><div class="big-answer">${esc(q.accept[0])}</div>
      ${q.accept.length > 1 ? `<div class="muted sm">Also accepted: ${q.accept.slice(1).map(esc).join(', ')}</div>` : ''}</div>
    <div class="jgrid wrap">${cards}</div>
    <div class="host-ctrl"><button class="btn primary big" data-act="next">Leaderboard →</button></div>
  </div>`);
}

function lbRow(p, i, showDelta, showMove) {
  const top = H._top || 1;
  const mv = showMove ? p.prevRank - p.rank : 0;
  return `<div class="lbrow ${i < 3 ? 'top' + (i + 1) : ''}" style="--d:${i * 70}ms">
    <div class="lbrank">${p.rank}</div><div class="lbav">${p.avatar}</div>
    <div class="lbmain">
      <div class="lbname">${esc(p.name)}${p.streak >= 3 ? ` <span class="fire">🔥${p.streak}</span>` : ''}${p.connected ? '' : ' <span class="muted sm">(offline)</span>'}</div>
      <div class="lbbar"><span style="--w:${Math.max(.02, p.score / top)}"></span></div>
    </div>
    <div class="lbright"><div class="lbscore">${fmt(p.score)}</div>
      <div class="lbdelta">${showDelta ? (p.lastDelta ? `<span class="pos">+${fmt(p.lastDelta)}</span>` : '<span>+0</span>') : ''}${mv > 0 ? `<span class="mv-up">▲${mv}</span>` : mv < 0 ? `<span class="mv-down">▼${-mv}</span>` : ''}</div></div>
  </div>`;
}

function showLeaderboard() {
  H.phase = 'leaderboard';
  const arr = ranked(); H._top = Math.max(1, arr[0] ? arr[0].score : 1);
  for (const p of arr) if (p.connected) send(p.conn, standMsg(p, arr));
  const last = H.qi >= H.qs.length - 1;
  const two = arr.length > 8;
  render(`<div class="page fade">
    <div class="topbar"><div class="pill">After Q ${H.qi + 1}/${H.qs.length}</div><span></span></div>
    <h1 class="h1 center-text glow">Leaderboard</h1>
    <div class="lb ${two ? 'two' : ''}" style="${two ? `grid-template-rows:repeat(${Math.ceil(arr.length / 2)},auto)` : ''}">${arr.map((p, i) => lbRow(p, i, true, H.qi > 0)).join('')}</div>
    <div class="host-ctrl"><button class="btn primary big" data-act="next">${last ? 'Final results 🏆' : 'Next question →'}</button>${last ? '' : '<button class="btn ghost sm" data-act="endGame">End game</button>'}</div>
  </div>`);
}

function showFinal() {
  clearInterval(H.cd); clearInterval(H.tick); clearTimeout(H.allIn);
  H.phase = 'final';
  const arr = ranked(); H._top = Math.max(1, arr[0] ? arr[0].score : 1);
  for (const p of arr) if (p.connected) send(p.conn, finalMsg(p));
  const pod = (p, place) => p ? `<div class="pod p${place}">${place === 1 ? '<div class="pod-crown">👑</div>' : ''}<div class="pod-av">${p.avatar}</div><div class="pod-name">${esc(p.name)}</div><div class="pod-score">${fmt(p.score)}</div><div class="pod-block">${place}</div></div>` : `<div class="pod p${place} empty"></div>`;

    <div class="podium">${pod(arr[1], 2)}${pod(arr[0], 1)}${pod(arr[2], 3)}</div>

    <div class="host-ctrl" style="align-items:center">
      <select id="nextPack" class="sel" title="Packet for the next round">${packs.map(p => `<option value="${p.id}" ${p.id === H.packet.id ? 'selected' : ''}>${esc(p.title)}</option>`).join('')}</select>
      <button class="btn primary" data-act="playAgain">↻ Play again with this lobby</button>
      <button class="btn" data-act="closeRoom">Close room</button>
    </div>
  </div>`);

}

function joinURL() { const u = new URL(location.href); u.search = '?room=' + H.code; u.hash = ''; return u.toString(); }

    <div class="lobby">

        ${isFile ? `<div class="warn">You're running from a local file, so there's no link for phones to scan. Upload this file to any free static host (Netlify Drop, GitHub Pages, etc.) and open it from that URL to get a scannable QR code.</div>` : ''}
      </div>
      <div class="card lobby-players">

function renderPlist() {
  const el = $('plist'); if (!el) return;
  const ps = [...H.players.values()];
  $('pcount').textContent = `${ps.length}/${MAX_PLAYERS}`;
  el.innerHTML = ps.length ? ps.map(p => {
    const isNew = !H.shown.has(p.key); H.shown.add(p.key);
    return `<div class="pchip ${p.connected ? '' : 'off'} ${isNew ? 'pop' : ''}"><span class="pav">${p.avatar}</span><span class="pname">${esc(p.name)}</span><button class="kick" data-act="kick" data-k="${esc(p.key)}" title="Remove player">✕</button></div>`;

function closeRoom() {
  if (!H) return;
  try { bcast({ t: 'closed' }); } catch (e) {}
  const peer = H.peer;
  clearInterval(H.cd); clearInterval(H.tick); clearTimeout(H.allIn);
  H = null;

/* =====================================================================
   PLAYER
   ===================================================================== */
let P = null;

function pTop() {
  return `<div class="ptop"><span class="pav">${P.avatar}</span><span class="pname">${esc(P.name)}</span><span class="pscore">${fmt(P.score)} pts</span></div>`;
}
function pScreen(inner, extraClass = '') {
  render(`<div class="page player ${extraClass} fade">${pTop()}<div class="center-page">${inner}</div></div>`);
}

function doJoin() {
  const code = ($('jCode').value || '').toUpperCase().replace(/[^A-Z]/g, '');
  const name = ($('jName').value || '').trim().replace(/\s+/g, ' ');
  if (code.length !== 4) return toast('Enter the 4-letter room code', 'bad');
  if (!name) return toast('Enter your name', 'bad');
  if (!PeerCtor) return toast('Could not load the networking library — check your connection and reload', 'bad');
  store.set('tb_name', name); store.set('tb_avatar', homeAvatar);
  const prev = sess.get('tb_sess', null);
  const token = prev && prev.token ? prev.token : uid();
  sess.set('tb_sess', { code, token });
  P = { code, name, avatar: homeAvatar, token, peer: null, conn: null, retries: 0, joined: false, ended: false,
        reconnecting: false, score: 0, qi: -1, phase: 'connecting' };
  render(`<div class="screen fade"><div class="spin"></div><div class="muted" style="font-weight:700">Joining room ${esc(code)}…</div></div>`);
  playerConnect(); wake();
}

function playerConnect() {
  if (!P || P.ended) return;
  const go = () => {
    const conn = P.peer.connect(PREFIX + P.code, { reliable: true, serialization: 'json' });
    P.conn = conn;
    let opened = false;
    const to = setTimeout(() => { if (!opened && P && P.conn === conn) playerLost(); }, 10000);
    conn.on('open', () => { opened = true; clearTimeout(to); send(conn, { t: 'join', name: P.name, avatar: P.avatar, token: P.token }); });
    conn.on('data', m => { if (P && P.conn === conn) playerMsg(m); });
    conn.on('close', () => { if (P && P.conn === conn) playerLost(); });
    conn.on('error', () => { if (P && P.conn === conn) playerLost(); });
  };
  if (P.peer && !P.peer.destroyed && P.peer.open) return go();
  if (P.peer) { try { P.peer.destroy(); } catch (e) {} }
  const peer = new PeerCtor({ debug: 0 });
  P.peer = peer;
  peer.on('open', () => { if (P && P.peer === peer) go(); });
  peer.on('disconnected', () => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} });
  peer.on('error', err => {
    if (!P || P.peer !== peer) return;
    if (err.type === 'peer-unavailable' && !P.joined) playerFail(`Room ${P.code} wasn't found. Double-check the code with your host.`);
    else playerLost();
  });
}

function playerLost() {
  if (!P || P.ended || P.reconnecting) return;
  P.reconnecting = true; P.retries++;
  const limit = P.joined ? 8 : 3;
  if (P.retries > limit) {
    P.reconnecting = false;
    return playerFail(P.joined ? 'Lost connection to the host.' : "Couldn't reach the host. Make sure you're on a decent connection (same Wi-Fi as the host works best) and try again.");
  }
  if (P.joined) pScreen(`<div class="spin"></div><h1 class="h2">Reconnecting…</h1><div class="muted">Hang tight — your score is safe.</div>`);
  const old = P.conn; P.conn = null;
  try { old && old.close(); } catch (e) {}
  setTimeout(() => { if (!P) return; P.reconnecting = false; playerConnect(); }, 1500);
}

function cleanupPlayer() {
  if (!P) return;
  P.ended = true; clearInterval(P.tick);
  const c = P.conn, pe = P.peer; P.conn = null;
  setTimeout(() => { try { c && c.close(); } catch (e) {} try { pe && pe.destroy(); } catch (e) {} }, 300);
}
function playerFail(msg) {
  cleanupPlayer(); sess.del('tb_sess');
  render(`<div class="screen fade"><div style="font-size:70px">📡</div><h1 class="h2 center-text">${esc(msg)}</h1><button class="btn primary" data-act="home">Back</button></div>`);
  P = null;
}
function playerEnd(icon, msg) {
  cleanupPlayer(); sess.del('tb_sess');
  render(`<div class="screen fade"><div style="font-size:80px">${icon}</div><h1 class="h2 center-text">${esc(msg)}</h1><button class="btn primary" data-act="home">Back to start</button></div>`);
  P = null;
}

function playerMsg(m) {
  if (!P || !m || typeof m !== 'object') return;
  switch (m.t) {
    case 'reject': {
      const reason = m.reason; cleanupPlayer(); sess.del('tb_sess'); P = null; screenHome(); toast(reason, 'bad'); break;
    }
    case 'welcome': P.joined = true; P.retries = 0; P.name = m.name; P.title = m.title; vibrate(30); break;
    case 'lobby':
      P.score = 0;
      if (P.phase === 'lobby' && $('pcount2')) { $('pcount2').textContent = `${m.count} player${m.count === 1 ? '' : 's'} in the lobby`; break; }
      P.phase = 'lobby';
      pScreen(`<div class="big-av bounce">${P.avatar}</div><h1 class="h1">You're in!</h1>
        <div class="muted">${esc(P.title || '')}</div>
        <div class="pill" id="pcount2">${m.count} player${m.count === 1 ? '' : 's'} in the lobby</div>
        <div class="waiting">Waiting for the host to start ${dots}</div>
        <button class="btn ghost sm" data-act="leave">Leave game</button>`);
      break;
    case 'getready':
      P.phase = 'getready'; P.qi = m.qi; clearInterval(P.tick);
      pScreen(`<div class="up muted">Question ${m.qi + 1} of ${m.total}</div>${m.double ? '<div class="double-badge">2× POINTS</div>' : ''}<div class="spin"></div><h1 class="h1">Get ready!</h1>`);
      break;
    case 'question': P.phase = 'question'; P.qi = m.qi; P.q = m; P.picks = new Set(); P.deadline = Date.now() + m.remaining; screenPlayerQuestion(); break;
    case 'locked':
      if (m.qi === P.qi && P.phase !== 'locked') {
        P.phase = 'locked';
        if (m.txt != null) screenLockedText(m.txt);
        else if (Array.isArray(m.cs)) screenLockedMulti(m.shapes || []);
        else screenLocked(m.shape != null ? m.shape : (P.q && P.q.shapes ? P.q.shapes[m.c] : 0));
      }
      break;
    case 'judging':
      if (P.phase === 'judging') break;
      P.phase = 'judging'; clearInterval(P.tick);
      pScreen(`<div style="font-size:90px" class="bounce">🧐</div><h1 class="h1">Checking answers…</h1><div class="waiting">The host is grading ${dots}</div>`);
      break;
    case 'result': screenPlayerResult(m); break;
    case 'stand': screenPlayerStand(m); break;
    case 'final': screenPlayerFinal(m); break;
    case 'kicked': playerEnd('👋', 'The host removed you from the game.'); break;
    case 'closed': playerEnd('🎉', 'The host closed the room. Thanks for playing!'); break;
  }
}

function screenPlayerQuestion() {
  const q = P.q;
  render(`<div class="page player fade">${pTop()}
    <div class="pq-head"><span class="pill">Q ${q.qi + 1}/${q.total}${q.double ? ' · 2×' : ''}</span><span id="ptime" class="ptime"></span></div>
    <div class="tbar"><span id="tbarFill"></span></div>
    <div class="pq-text">${esc(q.text)}</div>
    ${q.type === 'text' ? `<form class="writein" data-form="writein" autocomplete="off">
        <input id="wiInput" class="inp wi-inp" maxlength="60" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="Type your answer…">
        <button class="btn primary big full" type="submit">Lock it in ✍️</button>
        <div class="muted sm center-text">Spelling doesn't have to be perfect. Whatever you've typed is submitted when time runs out.</div>
      </form>`
      : q.type === 'multi' ? `<div class="multi-tip">☑ Select ALL that apply, then lock it in</div>
        <div class="pans-grid ${q.choices.length > 4 ? 'many' : ''}">${q.choices.map((c, i) => `<button class="pans multi a${q.shapes[i]}" data-act="toggleMulti" data-c="${i}"><span class="shape">${SHAPES[q.shapes[i]]}</span><span>${esc(c)}</span></button>`).join('')}</div>
        <button id="lockMulti" class="btn primary big full" data-act="lockMulti" disabled>Pick your answers</button>`
      : `<div class="pans-grid">${q.choices.map((c, i) => `<button class="pans a${q.shapes[i]}" data-act="answer" data-c="${i}"><span class="shape">${SHAPES[q.shapes[i]]}</span><span>${esc(c)}</span></button>`).join('')}</div>`}
  </div>`);
  if (q.type === 'text') { const wi = $('wiInput'); if (wi) try { wi.focus(); } catch (e) {} }
  clearInterval(P.tick);
  const total = q.time * 1000;
  const upd = () => {
    if (!P || P.phase !== 'question') { P && clearInterval(P.tick); return; }
    const left = P.deadline - Date.now();
    const t = $('ptime'), f = $('tbarFill');
    if (t) t.textContent = Math.max(0, Math.ceil(left / 1000)) + 's';
    if (f) f.style.transform = `scaleX(${Math.max(0, left / total)})`;
    if (left <= 0) {
      clearInterval(P.tick);
      const wi = $('wiInput');
      if (q.type === 'text' && wi && wi.value.trim()) { A.writein(); return; }
      if (q.type === 'multi' && P.picks && P.picks.size) { A.lockMulti(); return; }
      P.phase = 'timeout';
      pScreen(`<div style="font-size:90px">⏰</div><h1 class="h1">Time's up!</h1><div class="waiting">Waiting for results ${dots}</div>`);
    }
  };
  upd(); P.tick = setInterval(upd, 100);
}

function screenLocked(shape) {
  clearInterval(P.tick);
  pScreen(`<div class="locked-shape a${shape}">${SHAPES[shape]}</div><h1 class="h1">Locked in!</h1><div class="waiting">Waiting for everyone else ${dots}</div>`);
}

function screenLockedMulti(shapes) {
  clearInterval(P.tick);
  pScreen(`<div class="locked-row">${shapes.map(s => `<div class="locked-shape mini a${s}">${SHAPES[s]}</div>`).join('')}</div><h1 class="h1">Locked in!</h1><div class="waiting">Waiting for everyone else ${dots}</div>`);
}

function screenLockedText(txt) {
  clearInterval(P.tick);
  pScreen(`<div style="font-size:64px">✍️</div><div class="locked-txt">“${esc(txt)}”</div><h1 class="h1">Locked in!</h1><div class="waiting">Waiting for everyone else ${dots}</div>`);
}

function screenPlayerResult(m) {
  P.phase = 'result'; P.score = m.score; clearInterval(P.tick);
  const ok = m.ok === true;
  const title = ok ? 'Correct!' : m.ok === false ? 'Not quite!' : "Time's up!";
  pScreen(`<div class="res-icon">${ok ? '✓' : '✕'}</div><h1 class="h1">${title}</h1>
    ${ok ? `<div class="delta">+${fmt(m.delta)}</div>` : `<div class="muted">${m.type === 'multi' ? 'The correct answers were' : 'The answer was'} <b style="color:#fff">${m.shape != null ? SHAPES[m.shape] + ' ' : ''}${esc(m.answer)}</b></div>`}
    ${!ok && m.yours ? `<div class="muted sm">${m.type === 'multi' ? `You picked ${esc(m.yours)}` : `You wrote “${esc(m.yours)}”`}</div>` : ''}
    ${m.streak >= 2 ? `<div class="pill gold">🔥 ${m.streak} in a row!</div>` : ''}
    <div class="rank-card">You're in <b>${ordinal(m.rank)}</b> place <span class="muted">of ${m.total}</span></div>`, ok ? 'res-good' : 'res-bad');
  snd(ok ? 'correct' : 'wrong'); vibrate(ok ? [40, 60, 40] : 250);
}

function screenPlayerStand(m) {
  P.phase = 'stand'; P.score = m.score;
  pScreen(`<div class="up muted">Your position</div><div class="rank-big">${ordinal(m.rank)}</div>
    <div class="muted">of ${m.total} player${m.total === 1 ? '' : 's'}</div>
    <div class="score-big">${fmt(m.score)} pts</div>
    ${m.rank === 1 ? '<div class="pill gold">👑 You\'re in the lead!</div>' : m.gap ? `<div class="pill">${fmt(m.gap)} pts behind ${esc(m.aboveName)}</div>` : ''}
    <div class="waiting">${m.last ? 'Final results coming up' : 'Next question coming up'} ${dots}</div>`);
}

function screenPlayerFinal(m) {
  P.phase = 'final'; P.score = m.score; clearInterval(P.tick);
  const medal = m.rank === 1 ? '🥇' : m.rank === 2 ? '🥈' : m.rank === 3 ? '🥉' : '🎉';
  render(`<div class="page player fade"><canvas id="confetti"></canvas>${pTop()}<div class="center-page">
    <div class="medal">${medal}</div>
    <h1 class="h1">${m.rank === 1 ? 'You won!' : `You finished ${ordinal(m.rank)}`}</h1>
    <div class="muted">out of ${m.total} player${m.total === 1 ? '' : 's'}</div>
    <div class="score-big">${fmt(m.score)} pts</div>
    <div class="pill">✓ ${m.correct} of ${m.qcount} correct</div>
    <div class="waiting">The host may start another round ${dots}</div>
  </div></div>`);
  if (m.rank <= 3) { confetti(); snd('fanfare'); } else snd('correct');
}

/* =====================================================================
   ACTIONS (event delegation)
   ===================================================================== */
const A = {
  home() { if (P) { send(P.conn, { t: 'leave' }); cleanupPlayer(); P = null; } screenHome(); },
  hostHome() { screenHostHome(); },
  mute() { muted = !muted; store.set('tb_muted', muted); syncMute(); if (!muted) snd('tap'); },
  pickAv(el) {
    homeAvatar = el.dataset.v;
    document.querySelectorAll('.av').forEach(b => b.classList.toggle('sel', b === el)); snd('tap');
  },
  join() { doJoin(); },
  leave() { if (!P) return; send(P.conn, { t: 'leave' }); sess.del('tb_sess'); cleanupPlayer(); P = null; screenHome(); },

  newPacket() { ED = { id: uid(), title: '', questions: [normQ({})] }; edDirty = false; screenEditor(); },
  editPacket(el) { const p = getPackets().find(x => x.id === el.dataset.id); if (!p) return; ED = clone(p); edDirty = false; screenEditor(); },
  hostPacket(el) { const p = getPackets().find(x => x.id === el.dataset.id); if (p) startHosting(p); },
  exportPacket(el) {
    const p = getPackets().find(x => x.id === el.dataset.id); if (!p) return;
    const name = (p.title || 'packet').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'packet';
    download(name + '.json', JSON.stringify({ title: p.title, questions: p.questions }, null, 2));
  },
  delPacket(el) {
    const packs = getPackets(), p = packs.find(x => x.id === el.dataset.id);
    if (!p || !confirm(`Delete "${p.title}"? This can't be undone.`)) return;
    savePackets(packs.filter(x => x.id !== p.id)); screenHostHome();
  },
  importPacket() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result), list = Array.isArray(data) ? data : [data];
          const packs = getPackets(); let n = 0;
          list.forEach(d => { if (d && Array.isArray(d.questions)) { const p = normPacket(d); p.id = uid(); packs.push(p); n++; } });
          if (!n) throw new Error('none');
          savePackets(packs); toast(`Imported ${n} packet${n > 1 ? 's' : ''}`); screenHostHome();
        } catch (e) { toast("That file isn't a valid trivia packet", 'bad'); }
      };
      r.readAsText(f);
    };
    inp.click();
  },

  edBack() { if (edDirty && !confirm('Leave without saving your changes?')) return; ED = null; screenHostHome(); },
  edSave() { saveED(); toast('Packet saved ✓'); },
  edSaveHost() { saveED(); const p = clone(ED); ED = null; startHosting(p); if (!H) { ED = p; screenEditor(); } },
  addQ() { ED.questions.push(normQ({})); edDirty = true; screenEditor(); focusLastQ(); },
  addText() { ED.questions.push(normQ({ type: 'text', time: 30 })); edDirty = true; screenEditor(); focusLastQ(); },
  setType(el) {
    const q = ED.questions[+el.dataset.i], v = el.dataset.v;
    if (q.type === v) return;
    q.type = v; if (v !== 'mc' && q.time < 20) q.time = 30;
    if (v === 'multi' && !q.corrects.length) q.corrects = [q.correct];
    edDirty = true; const y = scrollY; screenEditor(); scrollTo(0, y);
  },
  addMulti() { ED.questions.push(normQ({ type: 'multi', corrects: [], time: 30 })); edDirty = true; screenEditor(); focusLastQ(); },
  toggleCorrect(el) {
    const q = ED.questions[+el.dataset.i], j = +el.dataset.j;
    q.corrects = q.corrects.includes(j) ? q.corrects.filter(x => x !== j) : [...q.corrects, j].sort((a, b) => a - b);
    edDirty = true;
    const on = q.corrects.includes(j), box = el.closest('.choice');
    box.classList.toggle('correct', on); el.textContent = on ? '✓' : '';
  },
  addTF() { ED.questions.push(normQ({ choices: ['True', 'False'], correct: 0, time: 10 })); edDirty = true; screenEditor(); focusLastQ(); },
  qMove(el) {
    const i = +el.dataset.i, j = i + (+el.dataset.d);
    if (j < 0 || j >= ED.questions.length) return;
    [ED.questions[i], ED.questions[j]] = [ED.questions[j], ED.questions[i]]; edDirty = true;
    const y = scrollY; screenEditor(); scrollTo(0, y);
  },
  qDup(el) { const i = +el.dataset.i; ED.questions.splice(i + 1, 0, clone(ED.questions[i])); edDirty = true; const y = scrollY; screenEditor(); scrollTo(0, y); },
  qDel(el) {
    const i = +el.dataset.i, q = ED.questions[i];
    if (q.text.trim() && !confirm(`Delete Q${i + 1}?`)) return;
    ED.questions.splice(i, 1); edDirty = true; const y = scrollY; screenEditor(); scrollTo(0, y);
  },
  setCorrect(el) {
    const i = +el.dataset.i, j = +el.dataset.j;
    ED.questions[i].correct = j; edDirty = true;
    const card = el.closest('.qcard');
    card.querySelectorAll('.choice').forEach((c, k) => { c.classList.toggle('correct', k === j); c.querySelector('.mark').textContent = k === j ? '✓' : ''; });
  },

  next() {
    if (!H) return;
    switch (H.phase) {
      case 'lobby': startGame(); break;
      case 'question': endQuestion(); break;
      case 'judge': finishJudging(); break;
      case 'reveal': showLeaderboard(); break;
      case 'leaderboard': nextQuestion(); break;
    }
  },
  endGame() { if (H && confirm('End the game now and show final results?')) showFinal(); },
  kick(el) {
    const p = H && H.players.get(el.dataset.k); if (!p) return;
    send(p.conn, { t: 'kicked' });
    const c = p.conn; setTimeout(() => { try { c && c.close(); } catch (e) {} }, 300);
    H.players.delete(p.key); H.shown.delete(p.key);
    bcast({ t: 'lobby', count: H.players.size }); renderPlist();
  },
  playAgain() {
    const sel = $('nextPack');
    if (sel) {
      const f = getPackets().find(p => p.id === sel.value);
      if (f) { const errs = validate(f); if (errs.length) return toast(errs[0], 'bad'); H.packet = f; H.qs = f.questions.map(compile); }
    }
    for (const [k, p] of H.players) {
      if (!p.connected) { H.players.delete(k); continue; }
      Object.assign(p, { score: 0, streak: 0, rank: 0, prevRank: 0, lastDelta: 0, lastOk: null, correctCount: 0 });
    }
    H.qi = -1; H.phase = 'lobby';
    bcast({ t: 'lobby', count: H.players.size });
    screenHostLobby();
  },
  closeRoom() {
    if (H && H.players.size && H.phase !== 'final' && !confirm('Close the room? All players will be disconnected.')) return;
    closeRoom();
  },

  judgeSet(el) {
    if (!H || H.phase !== 'judge') return;
    const key = el.dataset.k, ok = el.dataset.v === '1', a = H.answers.get(key);
    if (!a) return;
    for (const [k2, a2] of H.answers) if (a2.g === a.g) H.marks.set(k2, { ok, confirmed: true });
    snd('tap'); renderJudge(false);
  },
  judgeAcceptAll() {
    if (!H || H.phase !== 'judge') return;
    for (const m of H.marks.values()) m.confirmed = true;
    snd('tap'); renderJudge(false);
  },
  toggleKey() {
    store.set('tb_showkey', !store.get('tb_showkey', true));
    if (H && H.phase === 'judge') renderJudge(false);
  },
  writein() {
    if (!P || P.phase !== 'question' || P.q.type !== 'text') return;
    const wi = $('wiInput'), txt = (wi && wi.value || '').trim();
    if (!txt) { toast('Type an answer first', 'bad'); return; }
    P.phase = 'locked';
    send(P.conn, { t: 'answer', qi: P.qi, txt });
    snd('tap'); vibrate(25);
    if (wi) wi.blur();
    screenLockedText(txt);
  },
  toggleMulti(el) {
    if (!P || P.phase !== 'question' || P.q.type !== 'multi') return;
    const c = +el.dataset.c;
    if (P.picks.has(c)) P.picks.delete(c); else P.picks.add(c);
    el.classList.toggle('picked', P.picks.has(c));
    const b = $('lockMulti'), n = P.picks.size;
    if (b) { b.disabled = !n; b.textContent = n ? `Lock in ${n} answer${n === 1 ? '' : 's'} ✓` : 'Pick your answers'; }
    snd('tap'); vibrate(15);
  },
  lockMulti() {
    if (!P || P.phase !== 'question' || P.q.type !== 'multi') return;
    const cs = [...P.picks].sort((a, b) => a - b);
    if (!cs.length) { toast('Pick at least one answer', 'bad'); return; }
    P.phase = 'locked';
    send(P.conn, { t: 'answer', qi: P.qi, cs });
    snd('tap'); vibrate(25);
    screenLockedMulti(cs.map(c => P.q.shapes[c]));
  },
  answer(el) {
    if (!P || P.phase !== 'question') return;
    const c = +el.dataset.c;
    P.phase = 'locked';
    send(P.conn, { t: 'answer', qi: P.qi, c });
    snd('tap'); vibrate(25);
    screenLocked(P.q.shapes[c]);
  }
};

function focusLastQ() {
  const cards = document.querySelectorAll('.qcard'), last = cards[cards.length - 1];
  if (last) { last.scrollIntoView({ behavior: 'smooth', block: 'center' }); const t = last.querySelector('textarea'); t && setTimeout(() => t.focus(), 300); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const f = A[el.dataset.act];
  if (f) { e.preventDefault(); f(el); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'jCode') { const v = t.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); if (v !== t.value) t.value = v; return; }
  const b = t.dataset.bind; if (!b || !ED) return;
  const q = ED.questions[+t.dataset.i];
  if (b === 'title') ED.title = t.value;
  else if (b === 'text') q.text = t.value;
  else if (b === 'choice') q.choices[+t.dataset.j] = t.value;
  else if (b === 'accept') q.accept = t.value;
  else return;
  edDirty = true;
});
document.addEventListener('change', e => {
  const t = e.target, b = t.dataset.bind; if (!b || !ED) return;
  const q = ED.questions[+t.dataset.i];
  if (b === 'time') q.time = +t.value;
  else if (b === 'double') { q.double = t.checked; t.closest('.dbl').classList.toggle('on', t.checked); }
  else return;
  edDirty = true;
});

document.addEventListener('submit', e => {
  if (e.target.dataset.form === 'writein') { e.preventDefault(); A.writein(); }
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (e.key === 'Enter' && (e.target.id === 'jName' || e.target.id === 'jCode')) { e.preventDefault(); doJoin(); return; }
  if (H && (e.key === ' ' || e.key === 'ArrowRight') && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(tag)) { e.preventDefault(); A.next(); }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (H || P) wake();
  if (P && !P.ended && P.joined && !(P.conn && P.conn.open)) playerLost();
});

window.addEventListener('beforeunload', e => {
  if (H && H.players.size && H.phase !== 'final') { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- boot ---------- */
screenHome();
if (!PeerCtor) setTimeout(() => toast('Networking library failed to load — you need an internet connection to play.', 'bad'), 400);
})();
</script>
</body>
</html>
